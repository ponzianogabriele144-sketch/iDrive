<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#040405"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS Squircle Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border / Bezel -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="url(#goldRing)" stroke-width="4" opacity="0.7"/>

  <!-- Circular Outer Gauge Arc -->
  <circle cx="256" cy="240" r="160" fill="none" stroke="#27272a" stroke-width="20" stroke-linecap="round" stroke-dasharray="628 314" transform="rotate(135 256 240)"/>
  <circle cx="256" cy="240" r="160" fill="none" stroke="url(#amberGrad)" stroke-width="20" stroke-linecap="round" stroke-dasharray="480 460" transform="rotate(135 256 240)" filter="url(#glow)"/>

  <!-- Speedometer Ticks -->
  <circle cx="256" cy="240" r="125" fill="#121215" stroke="#27272a" stroke-width="2"/>

  <!-- Glowing Center Fuel Pump Icon -->
  <g transform="translate(196, 175) scale(1.2)">
    <!-- Fuel Pump Body -->
    <path d="M 10 95 L 10 18 C 10 12 14 8 20 8 L 65 8 C 71 8 75 12 75 18 L 75 95 Z" fill="url(#amberGrad)"/>
    <!-- Pump Screen/Window -->
    <rect x="22" y="22" width="41" height="28" rx="6" fill="#09090b"/>
    <text x="42" y="41" fill="#fbbf24" font-family="system-ui, -apple-system" font-weight="bold" font-size="14" text-anchor="middle">L/km</text>
    <!-- Nozzle Handle -->
    <path d="M 75 35 Q 92 35 92 50 L 92 78 Q 92 84 86 84 L 80 84" fill="none" stroke="url(#amberGrad)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 80 25 L 94 38 L 94 48" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Sleek Badge Banner at Bottom -->
  <rect x="116" y="410" width="280" height="46" rx="23" fill="#18181b" stroke="#3f3f46" stroke-width="2"/>
  <text x="256" y="440" fill="#f4f4f5" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="2" text-anchor="middle">FUEL &amp; ROUTE</text>
</svg>